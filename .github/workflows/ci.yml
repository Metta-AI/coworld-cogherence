name: Cogherence checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:training
      - run: pnpm build:numeric
      - run: pnpm emit-manifest && git diff --exit-code -- coworld/coworld_manifest_template.json
      - run: python3 scripts/test_prompt_games.py dist-server/game/training-bridge.js
      - run: python3 scripts/test_prompt_native_games.py dist-server/coworld/game-cli.js dist-server/game/llm-player.js "$RUNNER_TEMP/cogherence-prompts" "$GITHUB_SHA"
